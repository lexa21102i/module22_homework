<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Флаги пяти стран (Россия, Франция, Финляндия, Швейцария, Япония)</title>
    </head>
    <body>
        <div>🇷🇺 Россия</div>
        <!-- Флаг России: белый / синий / красный -->
    <svg width="180" height="120">
        <rect width="180" height="120" fill="white"/>
        <rect width="180" height="40" fill="#0039A6"/>
        <rect y="80" width="180" height="40" fill="#D52B1E"/>
    </svg>
    <br><br>

        <div>🇫🇷 Франция</div>
        <!-- Флаг Франции: синий / белый / красный вертикально -->
    <svg width="180" height="120">
        <rect width="60" height="120" fill="#0055A4"/>
        <rect x="60" width="60" height="120" fill="white"/>
        <rect x="120" width="60" height="120" fill="#EF4135"/>
    </svg>
    <br><br>

        <div>🇫🇮 Финляндия</div>
        <!-- Флаг Финляндии: белый фон + синий скандинавский крест -->
    <svg width="180" height="120">
        <rect width="180" height="120" fill="white"/>
        <rect y="40" width="180" height="40" fill="#003580"/>
        <rect x="50" width="40" height="120" fill="#003580"/>
    </svg>
    <br><br>

        <div>🇨🇭 Швейцария</div>
        <!-- Флаг Швейцарии: красный квадрат + белый крест -->
    <svg width="180" height="120">
        <rect width="180" height="120" fill="#FF0000"/>
        <rect y="40" width="180" height="40" fill="white"/>
        <rect x="60" width="60" height="120" fill="white"/>
    </svg>
    <br><br>

        <div>🇯🇵 Япония</div>
        <!-- Флаг Японии: белый фон + красный круг -->
    <svg width="180" height="120">
        <rect width="180" height="120" fill="white"/>
        <circle cx="90" cy="60" r="36" fill="#D52B1E"/>
    </svg>
    </body>
</html>
